<!DOCTYPE html>
<html lang="uk">

<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <title>GEO-Score: AI Аналізатор</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
            padding: 40px;
            max-width: 700px;
            margin: auto;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            resize: vertical;
        }

        button {
            background: #646cff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #535bf2;
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .results {
            display: none;
            margin-top: 30px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .progress-bg {
            background: #333;
            width: 100%;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            background: #4caf50;
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out, background 0.5s ease-in-out;
        }

        ul {
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <h1>GEO-Score ⚡</h1>
    <p>Перевірте, чи готовий ваш текст до індексації генеративними ШІ (ChatGPT, Perplexity).</p>

    <textarea id="textInput" placeholder="Вставте текст вашої статті сюди..."></textarea>
    <button onclick="analyzeText()">Оцінити текст</button>

    <div class="results" id="resultsBox">
        <h2>GEO Score: <span id="scoreValue">0</span>/100</h2>
        <div class="progress-bg">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <ul>
            <li>Кількість абзаців: <strong id="valParagraphs">0</strong></li>
            <li>Факти та цифри: <strong id="valNumbers">0</strong></li>
            <li>Елементи списків: <strong id="valLists">0</strong></li>
            <li>Markdown-заголовки: <strong id="valHeaders">0</strong></li>
            <li>Посилання на джерела: <strong id="valLinks">0</strong></li>
        </ul>

        <p>💡 <strong>Порада:</strong> <span id="valRecommendation"></span></p>
    </div>

    <script>
        async function analyzeText() {
            const text = document.getElementById('textInput').value;
            const btn = document.querySelector('button');

            if (!text.trim()) {
                alert("Будь ласка, введіть текст для аналізу!");
                return;
            }

            // Стан завантаження
            btn.innerText = "Аналізую...";
            btn.disabled = true;

            try {
                // Звертаємось до нашого Python API
                const response = await fetch('http://127.0.0.1:8000/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) throw new Error("Помилка сервера");

                const data = await response.json();

                // Оновлюємо UI
                document.getElementById('resultsBox').style.display = 'block';
                document.getElementById('scoreValue').innerText = data.score;

                // Змінюємо колір прогрес-бару залежно від оцінки
                const bar = document.getElementById('progressBar');
                bar.style.width = data.score + '%';
                bar.style.background = data.score >= 80 ? '#4caf50' : (data.score >= 50 ? '#ff9800' : '#f44336');

                // Виводимо всі детальні метрики
                document.getElementById('valParagraphs').innerText = data.stats.paragraphs;
                document.getElementById('valNumbers').innerText = data.stats.numbers;
                document.getElementById('valLists').innerText = data.stats.list_items;
                document.getElementById('valHeaders').innerText = data.stats.headers;
                document.getElementById('valLinks').innerText = data.stats.links;

                document.getElementById('valRecommendation').innerText = data.recommendation;

            } catch (error) {
                alert("Не вдалося з'єднатися з сервером. Перевірте, чи запущений Python-скрипт.");
            } finally {
                // Повертаємо кнопку в нормальний стан
                btn.innerText = "Оцінити текст";
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
